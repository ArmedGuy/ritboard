[project]
name = "ritboard"
version = "0.1.0"
description = "Big-screen planning board where agents post, sort and arrange findings and artifacts over MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "markdown-it-py>=4.2.0",
    "mcp>=2.3.0,<3",
    "platformdirs>=4.14.5",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
# Native window instead of a browser tab: `uv run --extra desktop ritboard app`
desktop = ["pywebview>=5.4"]

[project.scripts]
ritboard = "ritboard.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
